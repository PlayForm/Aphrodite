[workspace]
resolver = "2"
members = ["crates/aphrodite"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "CC0-1.0"
repository = "https://github.com/PlayForm/Aphrodite"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "2"
tracing = "0.1"
