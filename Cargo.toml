[workspace]
resolver = "2"
members = ["crates/aphrodite", "crates/aphrodite-hermes"]
exclude = ["Maintain/dynamic_hooks", "crates/s2-probe", "crates/s2-navigate"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "CC0-1.0"
repository = "https://github.com/PlayForm/Aphrodite"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = [
	"preserve_order",
	"arbitrary_precision",
	"raw_value",
] }
bytes = "1.12.0"
thiserror = "2.0.18"
tracing = "0.1.44"
