[workspace]
resolver = "2"
members = ["crates/aphrodite", "crates/aphrodite-hermes", "vendor/headroom/crates/headroom-core"]
exclude = ["tests/dynamic_hooks"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "CC0-1.0"
repository = "https://github.com/PlayForm/Aphrodite"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
bytes = "1.12.0"
thiserror = "2.0.18"
tracing = "0.1.44"
