[workspace]
resolver = "2"
members = ["crates/aphrodite", "crates/aphrodite-hermes"]
exclude = ["Maintain/dynamic_hooks"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "CC0-1.0"
repository = "https://github.com/PlayForm/Aphrodite"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = [
	"preserve_order",
	"arbitrary_precision",
	"raw_value",
] }
bytes = "1.12.1"
thiserror = "2.0.20"
tracing = "0.1.44"
