[workspace]
resolver = "2"
members = ["crates/aphrodite", "crates/aphrodite-hermes"]
# `vendor/headroom` is its own workspace (its `Cargo.toml` carries `[workspace]`
# with `workspace.dependencies`). It is consumed as a PATH dependency by
# `crates/aphrodite`, and a path dependency that roots its own workspace must be
# excluded from this one - otherwise cargo resolves the nested crate's
# `workspace = true` inheritance against THIS manifest and fails with
# "`dependency.thiserror` was not found in `workspace.dependencies`".
exclude = ["Maintain/dynamic_hooks", "vendor/headroom", "vendor/rtk"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "CC0-1.0"
repository = "https://github.com/PlayForm/Aphrodite"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = [
	"preserve_order",
	"arbitrary_precision",
	"raw_value",
] }
bytes = "1.12.1"
tracing = "0.1.44"
