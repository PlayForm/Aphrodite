[project]
name = "aphrodite-plugin"
version = "1.61.0"
description = "CCR compression plugin for Hermes Agent — context compression via proxy"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "TCH003", # move type-only comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_hooks.py" = ["E701", "E741", "N806", "B007"]
"_tools.py" = ["E701", "E741"]
"_resolve.py" = ["E741"]
"_engine.py" = ["E701"]
"_core.py" = ["E701"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
