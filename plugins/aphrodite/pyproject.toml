[project]
name = "aphrodite-plugin"
version = "1.62.21"
description = "CCR compression plugin for Hermes Agent  -  context compression via proxy"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.15.17",
    "pyright==1.1.410",
    "pytest==9.0.3",
    "pytest-asyncio==1.2.0",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "mypy==1.19.1",
    "black==26.3.1",
    "isort==6.1.0",
    "pre-commit==4.3.0",
    "build==1.4.4",
    "twine==6.2.0",
    "types-requests==2.32.4.20260107",
    "types-PyYAML==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "TCH003", # move type-only comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_tools.py" = ["E701", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
