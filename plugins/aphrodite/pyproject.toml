[project]
name = "aphrodite-plugin"
version = "1.62.16"
description = "CCR compression plugin for Hermes Agent  -  context compression via proxy"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "mypy>=1",
    "black>=25",
    "isort>=6",
    "pre-commit>=4",
    "build>=1",
    "twine>=6",
    "types-requests>=2",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "TCH003", # move type-only comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"_hooks.py" = ["E701", "E741", "N806", "B007"]
"_tools.py" = ["E701", "E741"]
"_resolve.py" = ["E741"]
"_engine.py" = ["E701"]
"_core.py" = ["E701"]
"skills/*/scripts/*.py" = ["E702"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
