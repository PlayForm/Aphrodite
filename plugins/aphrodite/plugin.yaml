name: aphrodite
version: 1.13.0
description: "CCR compression plugin - debug decision logging, deque LRU perf, stripped integrations."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
provides_context_engine: true
install_message: |
  aphrodite v1.13.0 - debug decision logging, deque LRU perf.
  Activate: hermes config set context.engine aphrodite
  Debug: APHRODITE_DEBUG=1 hermes ...
  Tools: aphrodite_retrieve, aphrodite_compress, aphrodite_stats, aphrodite_rebuild
