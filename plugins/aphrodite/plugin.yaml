name: aphrodite
version: 1.4.0
description: "Complete CCR compression plugin with context engine, recursive resolution, inline fallback. Replaces built-in compressor."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - pre_api_request
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - headroom_retrieve
  - headroom_compress
  - aphrodite_rebuild
provides_context_engine: true
install_message: |
  aphrodite v1.4.0 — CCR context engine + hooks + tools.
  Set context.engine: aphrodite in config.yaml to activate.
  Requires APHRODITE_API_KEY in ~/.hermes/.env.
