name: aphrodite
version: 1.7.0
description: "CCR compression plugin — context engine, recursive retrieve, inline fallback, session-scoped stores, extensible hooks, 4 tools."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - headroom_retrieve
  - headroom_compress
  - headroom_stats
  - aphrodite_rebuild
provides_context_engine: true
install_message: |
  aphrodite v1.7.0 — session-scoped, extensible hooks, 4 tools.
  Activate: hermes config set context.engine aphrodite
