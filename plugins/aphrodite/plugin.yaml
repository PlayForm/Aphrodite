name: aphrodite
version: 1.62.15
description: "CCR compression plugin - smoke test suite, feature toggles, regression tracking, 9 tools, catalog mode toggle."
kind: standalone
min_hermes_version: '0.16.0'
requires_hooks: true
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_test
  - aphrodite_catalog
provides_context_engine: true
# Engine threshold: -1=always compress, 0=disabled, >0=fill% (see _core.py, APHRODITE_ENGINE_THRESHOLD_PCT)
# Ships skills: aphrodite-dev-workflow, aphrodite-hook-reference, aphrodite-iterate-release
install_message: |
  aphrodite v1.62.14  -  CCR compression plugin for Hermes Agent.
  Proxies: token (:9798, SQLite, >1KB), cache (:9797, in-memory, >8KB).
  Engine: APHRODITE_CONTEXT_ENGINE=1 to enable context engine.
  Debug: APHRODITE_DEBUG=1 hermes ...
  Catalog: APHRODITE_CATALOG=full|compact|tool (default: compact)
  Scripting: APHRODITE_SCRIPTING=1 + --features scripting for Rhai hooks
  Tools: retrieve, compress, stats, rebuild, files, diff, search, test, catalog
