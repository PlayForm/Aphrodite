name: aphrodite
version: 1.62.24
description:
    "CCR compression plugin — 28-type classifier, 13 tools, context engine,
    TOML-driven templates."
kind: standalone
min_hermes_version: "0.16.0"
requires_hooks: true
provides_hooks:
    - on_session_start
    - transform_tool_result
    - pre_llm_call
    - transform_terminal_output
    - post_llm_call
provides_tools:
    - aphrodite_retrieve
    - aphrodite_compress
    - aphrodite_stats
    - aphrodite_rebuild
    - aphrodite_files
    - aphrodite_diff
    - aphrodite_search
    - aphrodite_test
    - aphrodite_catalog
    - aphrodite_reclassify
    - aphrodite_prefetch
    - aphrodite_prefetch_status
    - aphrodite_poll_container
provides_context_engine: true
# Engine threshold: -1=always compress, 0=disabled, >0=fill% (see _core.py, APHRODITE_ENGINE_THRESHOLD_PCT)
# Ships 9 skills: compression architecture, proxy lifecycle, tool guide, context engine, coding defaults, context efficiency, boundary behaviors, output formatting, presentation
install_message: |
    aphrodite v1.62.23  —  CCR compression plugin for Hermes Agent.
    Proxies: token (:9798, SQLite, >1KB), cache (:9797, in-memory, >8KB).
    Engine: context_engine=true in aphrodite.toml (default-on).
    Debug: APHRODITE_DEBUG=1 hermes ...
    Catalog: APHRODITE_CATALOG=full|compact|tool (default: compact)
    Tools: retrieve, compress, stats, rebuild, files, diff, search, test, catalog, reclassify, prefetch, prefetch_status, poll_container
