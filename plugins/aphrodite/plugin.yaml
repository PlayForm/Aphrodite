name: aphrodite
version: 1.62.3
description: "CCR compression plugin - smoke test suite, feature toggles, regression tracking, 9 tools, catalog mode toggle."
kind: standalone
min_hermes_version: '0.16.0'
requires_hooks: true
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_test
  - aphrodite_catalog
provides_context_engine: true
install_message: |
  aphrodite v1.55.0 - smoke test suite, feature toggles, regression tracking, 9 tools.
  Activate: hermes config set context.engine aphrodite
  Debug: APHRODITE_DEBUG=1 hermes ...
  Catalog: APHRODITE_CATALOG=full|compact|tool (default: compact)
  Tools: aphrodite_retrieve, aphrodite_compress, aphrodite_stats, aphrodite_rebuild, aphrodite_catalog
