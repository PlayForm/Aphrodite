name: aphrodite
version: 1.22.0
description: "CCR compression plugin - ccr hits/misses tracking, health 200, request history, compressed header."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
provides_context_engine: true
install_message: |
  aphrodite v1.15.0 - ccr hits/misses, health 200, request history, compressed header.
  Activate: hermes config set context.engine aphrodite
  Debug: APHRODITE_DEBUG=1 hermes ...
  Tools: aphrodite_retrieve, aphrodite_compress, aphrodite_stats, aphrodite_rebuild
