name: aphrodite
version: 1.49.0
description: "CCR compression plugin - smoke test suite, feature toggles, regression tracking, 8 tools."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
  - aphrodite_files
  - aphrodite_diff
  - aphrodite_search
  - aphrodite_test
provides_context_engine: true
install_message: |
  aphrodite v1.39.0 - smoke test suite, feature toggles, regression tracking, 8 tools.
  Activate: hermes config set context.engine aphrodite
  Debug: APHRODITE_DEBUG=1 hermes ...
  Tools: aphrodite_retrieve, aphrodite_compress, aphrodite_stats, aphrodite_rebuild
