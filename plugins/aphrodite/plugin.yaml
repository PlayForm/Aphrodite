name: aphrodite
version: 1.11.0
description: "CCR compression plugin - aphrodite tools, stripped non-coding integrations, latency tracking."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - aphrodite_retrieve
  - aphrodite_compress
  - aphrodite_stats
  - aphrodite_rebuild
provides_context_engine: true
install_message: |
  aphrodite v1.11.0 - stripped non-coding integrations, latency tracking, aphrodite_* tools.
  Activate: hermes config set context.engine aphrodite
  Debug: APHRODITE_DEBUG=1 hermes ...
  Tools: aphrodite_retrieve, aphrodite_compress, aphrodite_stats, aphrodite_rebuild
