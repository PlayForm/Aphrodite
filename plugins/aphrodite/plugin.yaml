name: aphrodite
version: 1.3.0
description: "Complete CCR compression plugin: proxy (cache+token) + inline fallback, recursive resolution, knowledge map, pre_api_request compression. Replaces hermes-compress-shim."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - pre_api_request
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - headroom_retrieve
  - headroom_compress
  - aphrodite_rebuild
install_message: |
  aphrodite v1.3.0 — complete CCR compression plugin.
  Requires APHRODITE_API_KEY in ~/.hermes/.env.
  Proxy auto-installed + auto-launched on session start.
  Inline fallback works without proxy — no provider switch needed.
