name: aphrodite
version: 1.5.0
description: "CCR compression plugin with context engine, recursive resolution, inline fallback. Replaces built-in compressor."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - headroom_retrieve
  - headroom_compress
  - aphrodite_rebuild
provides_context_engine: true
install_message: |
  aphrodite v1.5.0 — CCR context engine (20% threshold), sequential memory.
  Activate: hermes config set context.engine aphrodite
