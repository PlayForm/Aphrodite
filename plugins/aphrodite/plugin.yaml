name: aphrodite
version: 1.8.0
description: "CCR compression plugin — all thresholds configurable via env vars, debug logging, 4 tools, context engine."
kind: plugin
provides_hooks:
  - on_session_start
  - transform_tool_result
  - pre_llm_call
  - transform_terminal_output
  - post_llm_call
provides_tools:
  - headroom_retrieve
  - headroom_compress
  - headroom_stats
  - aphrodite_rebuild
provides_context_engine: true
install_message: |
  aphrodite v1.8.0 — env-configurable thresholds, debug logging.
  Activate: hermes config set context.engine aphrodite
  Debug: APHRODITE_DEBUG=1 hermes ...
  Config: APHRODITE_ENGINE_THRESHOLD_PCT=50 APHRODITE_TERMINAL_THRESHOLD=1024 ...
