# @playform/headroom
# Hermes Agent plugin - headroom MCP tools + native middleware
name: headroom
version: "1.0.1"
description: >
  Headroom MCP suite for Hermes Agent - compress, retrieve, stats.
  Native llm_request middleware (HERMES_HEADROOM_NATIVE=1) for transparent
  CCR resolution. Proxy-aware inline compression on direct API.
kind: plugin
author: PlayForm
homepage: https://github.com/PlayForm/HermesCompress

provides_tools:
  - headroom_compress
  - headroom_retrieve
  - headroom_stats
  - headroom_proxy_start
  - headroom_proxy_stop

provides_hooks:
  - llm_request
