# @playform/hermes-compress
# Hermes Agent plugin - headroom MCP tools + native middleware + proxyless CCR
name: hermes-compress
version: "1.0.2"
description: >
  Headroom MCP suite for Hermes Agent - compress, retrieve, stats.
  Native llm_request middleware (HERMES_HEADROOM_NATIVE=1) for transparent
  CCR resolution. Proxy-aware inline compression on direct API.
  Proxyless CCR mode (HERMES_HEADROOM_PROXYLESS=1) stores tool outputs
  locally and replaces them with retrievable CCR markers.
kind: plugin
author: PlayForm
homepage: https://github.com/PlayForm/HermesCompress
toolsets:
  - compression
provides_tools:
  - headroom_compress
  - headroom_retrieve
  - headroom_stats
  - headroom_proxy_start
  - headroom_proxy_stop
  - headroom_proxy_status
provides_hooks:
  - llm_request