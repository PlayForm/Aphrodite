name: Publish

concurrency:
  group: Publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    tags: ["Aphrodite/v*"]
  workflow_dispatch:
    inputs:
      publish_crates:
        description: "Attempt `cargo publish` to crates.io (publishes aphrodite-headroom-core first, then aphrodite, then aphrodite-hermes)"
        type: boolean
        default: false
      yank_previous:
        description: "Yank the previously-published broken version (1.3.8) from crates.io - run ONLY after the replacement (1.3.9) is confirmed live"
        type: boolean
        default: false

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # Scope to the crates we actually publish (aphrodite, aphrodite-hermes).
      # The vendored `vendor/headroom` submodule is a separate Cargo workspace
      # whose `kompress_parity` integration test is gated behind its `ml`
      # feature and fails to compile under `--workspace`; it is not part of
      # this repo's publish surface, so excluding it here unblocks the publish
      # gate without touching the vendored tree.
      - name: Cargo test
        run: cargo test -p aphrodite -p aphrodite-hermes --release

      # Packaging guard: the published tarball MUST contain the
      # builtin_directives/*.md files embedded via include_str! in
      # src/directives.rs. A recursive `*.md` exclude previously stripped
      # them from v1.3.8, producing a tarball that failed to compile on
      # `cargo install`. Fail loudly here (before any publish) if any are
      # missing. This also catches the broader class of "files present
      # locally but excluded from the package" regressions.
      - name: Verify packaged tarball includes embedded assets
        run: |
          cargo package -p aphrodite --list --allow-dirty 2>/dev/null | \
            grep -qE '^src/builtin_directives/focus\.md$' || {
              echo "::error::src/builtin_directives/focus.md missing from packaged tarball"; exit 1; }
          for f in focus foresight ccr-handling cleanup explore lazy; do
            cargo package -p aphrodite --list --allow-dirty 2>/dev/null | \
              grep -qE "^src/builtin_directives/$f\.md\$" || {
                echo "::error::src/builtin_directives/$f.md missing from packaged tarball"; exit 1; }
          done
          echo "packaging guard: all 6 builtin_directives/*.md present"

  Publish-Headroom-Core:
    name: Publish aphrodite-headroom-core
    needs: [Test]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            vendor/headroom/target/
          key: cargo-publish-headroom-${{ runner.os }}-${{ hashFiles('vendor/headroom/Cargo.lock') }}
          restore-keys: cargo-publish-headroom-${{ runner.os }}-

      # `aphrodite` path-depends on `headroom-core` (vendored via the Headroom
      # submodule, which declares its own `[workspace]` and is therefore a
      # separate Cargo workspace root, not a member of this one) using a
      # `path + version` dependency, aliased to the published package name
      # `aphrodite-headroom-core` (we publish under our own namespace rather
      # than the upstream `headroom-core` name - see crates/aphrodite/Cargo.toml
      # and vendor/headroom/crates/headroom-core/Cargo.toml). `cargo publish`
      # strips the `path` key and keeps only `package`/`version`, so publishing
      # aphrodite only succeeds once a matching aphrodite-headroom-core version
      # actually exists on crates.io. crates.io versions are immutable -
      # re-publishing one that's already live errors - so check first and skip
      # if it's already there.
      - name: Check if aphrodite-headroom-core version is already published
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_crates) || startsWith(github.ref, 'refs/tags/Aphrodite/') }}
        id: check
        working-directory: vendor/headroom
        run: |
          VERSION=$(grep '^version' crates/headroom-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sL "https://index.crates.io/ap/hr/aphrodite-headroom-core" | grep -q "\"vers\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish aphrodite-headroom-core to crates.io (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates && steps.check.outputs.published == 'false' }}
        working-directory: vendor/headroom
        run: cargo publish -p aphrodite-headroom-core --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  Publish-Aphrodite:
    name: Publish aphrodite
    needs: [Test, Publish-Headroom-Core]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p aphrodite

      # crates.io publishing is opt-in - run it only on an explicit
      # `workflow_dispatch` with publish_crates=true (so it can fail loudly
      # rather than annotating every tag-push release as red). Once
      # Publish-Headroom-Core has run, aphrodite-headroom-core is live on
      # crates.io and this succeeds.
      - name: Publish to crates.io (opt-in)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_crates) || startsWith(github.ref, 'refs/tags/Aphrodite/') }}
        run: cargo publish -p aphrodite --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  Publish-Hermes:
    name: Publish aphrodite-hermes
    needs: [Publish-Aphrodite]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p aphrodite-hermes

      # Opt-in (see the Publish-Aphrodite job): needs aphrodite published
      # first, which needs aphrodite-headroom-core published first
      # (Publish-Headroom-Core). Runs only on explicit workflow_dispatch with
      # publish_crates.
      - name: Publish to crates.io (opt-in)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_crates) || startsWith(github.ref, 'refs/tags/Aphrodite/') }}
        run: cargo publish -p aphrodite-hermes --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Yank the previously-published broken version. Opt-in only - never runs on
  # a tag push, and must be triggered manually AFTER the replacement version
  # is confirmed live on crates.io, so `cargo install` always resolves to a
  # working version. Yanking removes a version from the default resolver
  # results but keeps the tarball downloadable; it is the only way to
  # withdraw a known-broken immutable release.
  Yank-Broken:
    name: Yank broken previous version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.yank_previous }}
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0

      - name: Yank aphrodite 1.3.8
        run: cargo yank -p aphrodite@1.3.8
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Yank aphrodite-hermes 1.3.8
        run: cargo yank -p aphrodite-hermes@1.3.8
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
