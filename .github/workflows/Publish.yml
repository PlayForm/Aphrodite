name: Publish

concurrency:
  group: Publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    tags: ["Aphrodite/v*"]
  workflow_dispatch:

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            Target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Cargo test
        run: cargo test --workspace

  Publish-Aphrodite:
    name: Publish aphrodite
    needs: [Test]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            Target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p aphrodite

      # crates.io publishing is best-effort: `aphrodite` depends on the vendored
      # Headroom fork (`headroom-core`) via a path-only dependency, which is not
      # published to crates.io, so `cargo publish` cannot resolve it. The real
      # distribution channel is the prebuilt binaries from Build.yml → GitHub
      # Releases. This step stays in place (and goes green) so it begins working
      # automatically if headroom-core is ever published; until then a failed
      # publish must not fail the release pipeline.
      - name: Publish to crates.io (best-effort)
        if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
        continue-on-error: true
        run: cargo publish -p aphrodite --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  Publish-Hermes:
    name: Publish aphrodite-hermes
    needs: [Publish-Aphrodite]
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            Target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p aphrodite-hermes

      # Best-effort: aphrodite-hermes depends on `aphrodite`, which cannot be
      # published while it carries a path dependency on the vendored Headroom
      # fork (see the Publish-Aphrodite job). Kept in place but non-fatal.
      - name: Publish to crates.io (best-effort)
        if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
        continue-on-error: true
        run: cargo publish -p aphrodite-hermes --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
