name: Publish

concurrency:
  # Under workflow_run chaining github.ref is the default branch, not the
  # tag - key the group on the triggering Build run's tag instead so a
  # faster v1.6.4 chain can never cancel an in-flight v1.6.3 publish.
  group: Publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write

# Publish runs ONLY after Build.yml's run for the same release tag has
# completed successfully (workflow_run chaining). The tag push itself no
# longer starts Publish, so publishing can never race or precede the build,
# and the gitlink bump can never run before Build.yml's Finalize has pushed
# the child SHA256SUMS commit. Every job is gated on the triggering run's
# conclusion + tag shape, and every checkout is pinned to that tag so the
# published code is exactly the code Build tested.
on:
  workflow_run:
    # The `workflows:` list matches the referenced workflow's `name:`
    # metadata (Build.yml declares `name: Build`), NOT the file name - a
    # filename here silently never fires the event.
    workflows: ["Build"]
    types: [completed]

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Test:
    name: Test
    # Only a SUCCESSFUL Build run that was triggered by an Aphrodite release
    # tag may start the publish chain (workflow_run chaining).
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Pin to the exact tag Build ran - the publish suite must test the
          # same code, not whatever the default branch happens to be at.
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Rust (nightly, latest)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # Scope to the crates we actually publish (aphrodite, aphrodite-hermes).
      # The vendored `vendor/headroom` submodule is a separate Cargo workspace
      # whose `kompress_parity` integration test is gated behind its `ml`
      # feature and fails to compile under `--workspace`; it is not part of
      # this repo's publish surface, so excluding it here unblocks the publish
      # gate without touching the vendored tree.
      - name: Cargo test
        run: cargo test -p aphrodite -p aphrodite-hermes --release

      # Packaging guard: the published tarball MUST contain the
      # builtin_directives/*.md files embedded via include_str! in
      # src/directives.rs. A recursive `*.md` exclude previously stripped
      # them from v1.3.8, producing a tarball that failed to compile on
      # `cargo install`. Fail loudly here (before any publish) if any are
      # missing. This also catches the broader class of "files present
      # locally but excluded from the package" regressions.
      - name: Verify packaged tarball includes embedded assets
        run: |
          cargo package -p aphrodite --list --allow-dirty 2>/dev/null | \
            grep -qE '^src/builtin_directives/focus\.md$' || {
              echo "::error::src/builtin_directives/focus.md missing from packaged tarball"; exit 1; }
          for f in focus foresight ccr-handling cleanup explore lazy; do
            cargo package -p aphrodite --list --allow-dirty 2>/dev/null | \
              grep -qE "^src/builtin_directives/$f\.md\$" || {
                echo "::error::src/builtin_directives/$f.md missing from packaged tarball"; exit 1; }
          done
          echo "packaging guard: all 6 builtin_directives/*.md present"

  Publish-Headroom-Core:
    name: Publish aphrodite-headroom-core
    needs: [Test]
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v')
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Rust (nightly, latest)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            vendor/headroom/target/
          key: cargo-publish-headroom-${{ runner.os }}-${{ hashFiles('vendor/headroom/Cargo.lock') }}
          restore-keys: cargo-publish-headroom-${{ runner.os }}-

      # `aphrodite` path-depends on `headroom-core` (vendored via the Headroom
      # submodule, which declares its own `[workspace]` and is therefore a
      # separate Cargo workspace root, not a member of this one) using a
      # `path + version` dependency, aliased to the published package name
      # `aphrodite-headroom-core` (we publish under our own namespace rather
      # than the upstream `headroom-core` name - see crates/aphrodite/Cargo.toml
      # and vendor/headroom/crates/headroom-core/Cargo.toml). `cargo publish`
      # strips the `path` key and keeps only `package`/`version`, so publishing
      # aphrodite only succeeds once a matching aphrodite-headroom-core version
      # actually exists on crates.io. crates.io versions are immutable -
      # re-publishing one that's already live errors - so check first and skip
      # if it's already there.
      - name: Check if aphrodite-headroom-core version is already published
        if: ${{ startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v') }}
        id: check
        working-directory: vendor/headroom
        run: |
          VERSION=$(grep '^version' crates/headroom-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sL "https://index.crates.io/ap/hr/aphrodite-headroom-core" | grep -q "\"vers\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish aphrodite-headroom-core to crates.io (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates && steps.check.outputs.published == 'false' }}
        working-directory: vendor/headroom
        run: cargo publish -p aphrodite-headroom-core --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  Publish-Aphrodite:
    name: Publish aphrodite
    needs: [Test, Publish-Headroom-Core]
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v')
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Rust (nightly, latest)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p aphrodite

      # crates.io publishing is opt-in - run it only on an explicit
      # `workflow_dispatch` with publish_crates=true (so it can fail loudly
      # rather than annotating every tag-push release as red). Once
      # Publish-Headroom-Core has run, aphrodite-headroom-core is live on
      # crates.io and this succeeds.
      - name: Publish to crates.io (opt-in)
        if: ${{ startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v') }}
        run: cargo publish -p aphrodite --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  Publish-Hermes:
    name: Publish aphrodite-hermes
    needs: [Publish-Aphrodite]
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v')
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Rust (nightly, latest)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-publish-${{ runner.os }}-

      - name: Build release
        run: cargo build --release -p aphrodite-hermes

      # Opt-in (see the Publish-Aphrodite job): needs aphrodite published
      # first, which needs aphrodite-headroom-core published first
      # (Publish-Headroom-Core). Runs only on explicit workflow_dispatch with
      # publish_crates.
      - name: Publish to crates.io (opt-in)
        if: ${{ startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v') }}
        run: cargo publish -p aphrodite-hermes --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The catalog pins the CHILD plugin repo (plugins/aphrodite submodule);
  # Build.yml's Finalize job commits the fresh in-tree SHA256SUMS.txt inside
  # the child and pushes its Current. This job advances the PARENT's gitlink
  # to that child commit so the pinned tree carries the checksums that
  # download.sh validates against (teknium review, PR 118488: "the shasum
  # list has to come from Build.yml").
  Bump-Plugin-Gitlink:
    name: Bump plugin submodule gitlink
    needs: [Publish-Aphrodite]
    # workflow_run chaining: Build.yml has fully completed by now, so
    # Finalize's child SHA256SUMS commit is already on the child's Current.
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'Aphrodite/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          # Pin to the release tag, not the default branch: the gitlink bump
          # must commit on the line the tag was cut from.
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Advance child submodule to its Current tip
        run: |
          set -euo pipefail
          CHILD="plugins/aphrodite"
          # Build.yml has completed (workflow_run) and Finalize pushed the
          # child commit carrying the fresh SHA256SUMS.txt; the retry is
          # belt-and-braces for remote propagation lag.
          for i in 1 2 3 4 5; do
            if git -C "${CHILD}" fetch origin Current 2>/dev/null; then break; fi
            echo "child fetch attempt $i failed; retrying in 10s"
            sleep 10
          done
          git -C "${CHILD}" checkout -q origin/Current
          echo "child now at: $(git -C "${CHILD}" rev-parse HEAD)"

      - name: Commit the gitlink bump
        run: |
          set -euo pipefail
          CHILD="plugins/aphrodite"
          if git diff --quiet -- "${CHILD}"; then
            echo "gitlink already at child Current tip - nothing to bump"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Under workflow_run, GITHUB_REF_NAME is the default branch, not
          # the tag - take the version from the triggering Build run.
          TAG="${{ github.event.workflow_run.head_branch }}"
          V="${TAG#Aphrodite/v}"
          git add "${CHILD}"
          git commit -m "chore: bump plugins/aphrodite to child Current (in-tree SHA256SUMS.txt for v${V})"
          # The tag was pushed from Current; keep the parent's branch in sync.
          BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || echo Current)"
          # Current is branch-protected (required status checks) - GITHUB_TOKEN
          # pushes to it are rejected (GH006). The gitlink bump then stays a
          # manual admin push; degrade with a loud warning instead of failing
          # the whole publish chain (the crates publish already succeeded).
          if ! git push origin "HEAD:${BRANCH}" 2>&1 | tee /tmp/gitlink-push.log; then
            if grep -qE "GH006|protected branch" /tmp/gitlink-push.log; then
              echo "::warning::Current is branch-protected - the gitlink bump must be pushed manually (admin push) or by adding github-actions[bot] as a bypass actor on the Current rule; the pipeline continues"
              exit 0
            fi
            echo "::error::gitlink push failed for an unexpected reason:" >&2
            cat /tmp/gitlink-push.log >&2
            exit 1
          fi

