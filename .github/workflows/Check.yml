name: Check

concurrency:
  group: Check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [Current]
    paths-ignore: [".github/Update.md"]
  pull_request:
    branches: [Current]
  workflow_dispatch:
  workflow_call:

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Rust:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-

      - name: cargo check
        run: cargo check --workspace --release

      - name: cargo clippy
        # Scoped to the two actual workspace members, not `--workspace`:
        # `headroom-core` is a path *dependency* (vendor/headroom, its own
        # separate submodule/repo, out of scope per this report's §5), but
        # `--workspace` picks it up as a lint target too since path deps
        # aren't cap-lints-suppressed the way registry deps are - verified
        # locally, `--workspace -D warnings` fails on 3 pre-existing
        # vendor/headroom lints this repo doesn't own.
        run: cargo clippy -p aphrodite -p aphrodite-hermes -- -D warnings

      - name: Setup Rust (nightly, fmt only)
        # rustfmt.toml sets `unstable_features = true` and relies on several
        # nightly-only options (notably `space_after_colon = false`, the
        # repo's established no-space type-annotation style). Under stable,
        # rustfmt silently drops those settings instead of erroring, which
        # makes `cargo fmt --check` want to reformat the entire existing
        # codebase (1235 diff hunks, verified locally) - a false-positive
        # gate, not a real regression. A pinned dated nightly is carried
        # solely for this one step; every other job uses stable.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07)
        with:
          toolchain: nightly-2026-05-01
          components: rustfmt

      - name: cargo fmt --check
        run: cargo +nightly-2026-05-01 fmt --all -- --check

  Test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: cargo test
        run: cargo test --workspace --release

      # Maintain/dynamic_hooks/rust is its own standalone Cargo project (not
      # a workspace member of the root Cargo.toml), so `cargo test
      # --workspace` above never touches its 6 tests - they carried zero CI
      # coverage until this step.
      - name: cargo test (Maintain/dynamic_hooks)
        run: cargo test --manifest-path Maintain/dynamic_hooks/rust/Cargo.toml

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build aphrodite-hermes dylib for FFI tests
        run: cargo build --release -p aphrodite-hermes

      - name: Python FFI tests
        env:
          APHRODITE_REQUIRE_DYLIB: 1
        run: uv run --with pytest pytest tests/ -q

  Python:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Verify submodules
        run: |
          git submodule status
          ls plugins/aphrodite/plugin.yaml || echo "MISSING: plugins/aphrodite not checked out"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: plugins/aphrodite/

      - name: pyright
        run: cd plugins/aphrodite && npx pyright@1.1.411 .

  Deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # NOTE: as of this job's introduction, `cargo deny check` genuinely
      # fails: `paste` is flagged unmaintained (advisories), and two
      # transitive deps carry NCSA / CDLA-Permissive-2.0 licenses not on the
      # licenses.allow list (licenses). These are real findings, not schema
      # errors - accepting/ignoring them is a policy decision for a human,
      # not something this pass makes unilaterally. Until triaged, expect
      # this job to be red.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
