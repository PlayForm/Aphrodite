name: Build

concurrency:
    group: Build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    security-events: write
    pull-requests: write

on:
    push:
        tags: ["Aphrodite/v*"]
    pull_request:
        branches: [Current]
    workflow_dispatch:

env:
    ADBLOCK: true
    ASTRO_TELEMETRY_DISABLED: 1
    AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
    AZURE_CORE_COLLECT_TELEMETRY: 0
    CARGO_TERM_COLOR: always
    CHOOSENIM_NO_ANALYTICS: 1
    DIEZ_DO_NOT_TRACK: 1
    DO_NOT_TRACK: 1
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
    ET_NO_TELEMETRY: 1
    GATSBY_TELEMETRY_DISABLED: 1
    GATSBY_TELEMETRY_OPT_OUT: 1
    GATSBY_TELEMETRY_OPTOUT: 1
    GRIT_TELEMETRY_DISABLED: 1
    HASURA_GRAPHQL_ENABLE_TELEMETRY: false
    HINT_TELEMETRY: off
    HOMEBREW_NO_ANALYTICS: 1
    INFLUXD_REPORTING_DISABLED: true
    ITERATIVE_DO_NOT_TRACK: 1
    NEXT_TELEMETRY_DEBUG: 1
    NEXT_TELEMETRY_DISABLED: 1
    NG_CLI_ANALYTICS: false
    NUXT_TELEMETRY_DISABLED: 1
    PIN_DO_NOT_TRACK: 1
    POWERSHELL_TELEMETRY_OPTOUT: 1
    SAM_CLI_TELEMETRY: 0
    STNOUPGRADE: 1
    STRIPE_CLI_TELEMETRY_OPTOUT: 1
    TELEMETRY_DISABLED: 1
    TERRAFORM_TELEMETRY: 0
    VCPKG_DISABLE_METRICS: 1

jobs:
    Test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v6.0.3
              with:
                  submodules: false

            - name: Init submodule from remote
              run: |
                  git submodule update --init --remote --recursive || true
                  git submodule status

            - name: Setup Rust (nightly)
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/
                      ~/.cargo/git/
                      target/
                  key: cargo-check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: cargo-check-${{ runner.os }}-

            - name: Test
              run: cargo test -p aphrodite --release

    Build:
        name: Build ${{ matrix.target }}
        needs: Test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: macos-13
                      target: x86_64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        steps:
            - uses: actions/checkout@v6.0.3
              with:
                  submodules: false

            - name: Init submodule from remote
              run: |
                  git submodule update --init --remote --recursive || true
                  git submodule status

            - name: Setup Rust (nightly)
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: ${{ matrix.target }}

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/
                      ~/.cargo/git/
                      target/
                  key: cargo-check-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: cargo-check-${{ runner.os }}-${{ matrix.target }}-

            - name: Build
              run: cargo build --release -p aphrodite --target ${{ matrix.target }}

            - name: Rename binary (full triple)
              shell: bash
              run: |
                  TARGET="${{ matrix.target }}"
                  SRC="target/${TARGET}/release/aphrodite"
                  if [[ "$TARGET" == *windows* ]]; then
                      SRC="${SRC}.exe"
                      DST="aphrodite-${TARGET}.exe"
                  else
                      DST="aphrodite-${TARGET}"
                  fi
                  cp "$SRC" "$DST"
                  ls -lh "$DST"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              continue-on-error: true
              with:
                  name: aphrodite-${{ matrix.target }}
                  path: aphrodite-${{ matrix.target }}
                  retention-days: 30

    Release:
        name: Release
        needs: Build
        if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
        runs-on: ubuntu-latest
        environment: Release
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts/

            - name: Display artifacts
              run: find artifacts/ -type f -exec ls -lh {} \;

            - name: Create GitHub Release
              continue-on-error: true
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/**/aphrodite-*
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
