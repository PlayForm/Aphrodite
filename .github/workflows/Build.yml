name: Build

concurrency:
  group: Build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  pull-requests: write

on:
  push:
    tags: ["Aphrodite/v*"]
  workflow_dispatch:

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      id-token: write

    steps:
      # Creates the release exactly once, before any matrix job attaches
      # files, so five concurrent `action-gh-release` invocations don't race
      # to create it. Release notes are authored per
      # `.hermes/RELEASE-TEMPLATE.md` by the release process (see SKILL.md),
      # not auto-generated here.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Build:
    name: Build ${{ matrix.target }}
    needs: Release
    if: always() && (needs.Release.result == 'success' || needs.Release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish (and attach its assets) even if one leg is
      # slow or fails - Windows is the long pole. The `Finalize` job below then
      # fails loudly if the matrix came out incomplete, so a partial upload is
      # caught rather than silently shipped.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest # cross-compiled from arm64; macos-13 (real Intel host) queues indefinitely on GH-hosted runners
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install onnxruntime (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz -O /tmp/ort.tgz
          tar xzf /tmp/ort.tgz -C /tmp
          echo "LD_LIBRARY_PATH=/tmp/onnxruntime-linux-x64-1.21.0/lib" >> $GITHUB_ENV
          echo "/tmp/onnxruntime-linux-x64-1.21.0/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig

      - name: Setup Rust (stable 1.96.0)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-07), pins to rust-toolchain.toml's 1.96.0
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ matrix.target }}-

      # Build both the proxy binary (`aphrodite`) AND the plugin dylib
      # (`libaphrodite_hermes`) - the Hermes plugin loads the dylib at runtime,
      # so it must ship per-platform alongside the binary.
      - name: Build
        run: cargo build --release -p aphrodite -p aphrodite-hermes --target ${{ matrix.target }}

      - name: Stage release artifacts (full triple)
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          DIR="target/${TARGET}/release"
          if [[ "$TARGET" == *windows* ]]; then
              cp "$DIR/aphrodite.exe"             "aphrodite-${TARGET}.exe"
              cp "$DIR/aphrodite_hermes.dll"      "libaphrodite_hermes-${TARGET}.dll"
          elif [[ "$TARGET" == *apple* ]]; then
              cp "$DIR/aphrodite"                 "aphrodite-${TARGET}"
              cp "$DIR/libaphrodite_hermes.dylib" "libaphrodite_hermes-${TARGET}.dylib"
          else
              cp "$DIR/aphrodite"                 "aphrodite-${TARGET}"
              cp "$DIR/libaphrodite_hermes.so"    "libaphrodite_hermes-${TARGET}.so"
          fi
          ls -lh aphrodite-${TARGET}* libaphrodite_hermes-${TARGET}*

      # Windows gets its own PowerShell step (Get-FileHash), not bash +
      # certutil/findstr: Git Bash's MSYS path-conversion layer mangles a
      # single-slash flag like `findstr /v "hash"` into a filesystem path
      # (e.g. treating `/v` as a root-relative path), so `findstr` tried to
      # open a file literally named "hash"/"CertUtil" instead of using them
      # as an exclude pattern - "FINDSTR: Cannot open hash". This silently
      # broke every Windows release artifact (job always failed here).
      - name: Generate checksums (Windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $binHash = (Get-FileHash "aphrodite-$target.exe" -Algorithm SHA256).Hash.ToLower()
          $dllHash = (Get-FileHash "libaphrodite_hermes-$target.dll" -Algorithm SHA256).Hash.ToLower()
          "$binHash  aphrodite-$target.exe" | Out-File -FilePath "SHA256SUMS-$target.txt" -Encoding ascii
          "$dllHash  libaphrodite_hermes-$target.dll" | Out-File -FilePath "SHA256SUMS-$target.txt" -Encoding ascii -Append
          Get-Content "SHA256SUMS-$target.txt"

      - name: Generate checksums
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          shasum -a 256 aphrodite-${TARGET}* libaphrodite_hermes-${TARGET}* > "SHA256SUMS-${TARGET}.txt"
          cat "SHA256SUMS-${TARGET}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aphrodite-${{ matrix.target }}
          path: |
            aphrodite-${{ matrix.target }}*
            libaphrodite_hermes-${{ matrix.target }}*
            SHA256SUMS-${{ matrix.target }}.txt
          retention-days: 30

      # The Release job above already created the release (exactly once);
      # each matrix job only attaches its own files here.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          # Trailing * catches the Windows `.exe`; fail loudly if a rename slips.
          files: |
            aphrodite-${{ matrix.target }}*
            libaphrodite_hermes-${{ matrix.target }}*
            SHA256SUMS-${{ matrix.target }}.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs once, only after EVERY matrix leg has finished attaching (needs: Build).
  # This is the race-killer behind the recurring "no Windows release" note: the
  # release body's "What Ships" was authored from a point-in-time asset snapshot
  # while the slow Windows leg was still building, so it hedged "no Windows" even
  # though the .exe/.dll landed minutes later. This job asserts all four targets'
  # assets are present and fails loudly otherwise - so notes can never truthfully
  # be authored (or shipped) for an incomplete matrix.
  Finalize:
    name: Finalize release assets
    needs: [Build]
    if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify every platform's assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "Attached assets:"; echo "$assets"
          missing=0
          for t in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            echo "$assets" | grep -q "aphrodite-$t"          || { echo "::error::missing binary for $t";    missing=1; }
            echo "$assets" | grep -q "libaphrodite_hermes-$t" || { echo "::error::missing dylib for $t";     missing=1; }
            echo "$assets" | grep -q "SHA256SUMS-$t"          || { echo "::error::missing checksums for $t"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release matrix is incomplete - do NOT publish notes claiming a full platform set."
            exit 1
          fi
          echo "All 4 platforms present (12 assets). Matrix complete - Windows included."
