name: Build

concurrency:
  group: Build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  pull-requests: write

on:
  push:
    tags: ["Aphrodite/v*"]
  workflow_dispatch:

env:
  ADBLOCK: true
  ASTRO_TELEMETRY_DISABLED: 1
  AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  CARGO_TERM_COLOR: always
  CHOOSENIM_NO_ANALYTICS: 1
  DIEZ_DO_NOT_TRACK: 1
  DO_NOT_TRACK: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
  ET_NO_TELEMETRY: 1
  GATSBY_TELEMETRY_DISABLED: 1
  GATSBY_TELEMETRY_OPT_OUT: 1
  GATSBY_TELEMETRY_OPTOUT: 1
  GRIT_TELEMETRY_DISABLED: 1
  HASURA_GRAPHQL_ENABLE_TELEMETRY: false
  HINT_TELEMETRY: off
  HOMEBREW_NO_ANALYTICS: 1
  INFLUXD_REPORTING_DISABLED: true
  ITERATIVE_DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DEBUG: 1
  NEXT_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: false
  NUXT_TELEMETRY_DISABLED: 1
  PIN_DO_NOT_TRACK: 1
  POWERSHELL_TELEMETRY_OPTOUT: 1
  SAM_CLI_TELEMETRY: 0
  STNOUPGRADE: 1
  STRIPE_CLI_TELEMETRY_OPTOUT: 1
  TELEMETRY_DISABLED: 1
  TERRAFORM_TELEMETRY: 0
  VCPKG_DISABLE_METRICS: 1

jobs:
  Build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13 # Intel host for x86_64 mac builds
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: recursive

      - name: Install onnxruntime (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz -O /tmp/ort.tgz
          tar xzf /tmp/ort.tgz -C /tmp
          echo "LD_LIBRARY_PATH=/tmp/onnxruntime-linux-x64-1.21.0/lib" >> $GITHUB_ENV
          echo "/tmp/onnxruntime-linux-x64-1.21.0/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig

      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-check-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-${{ matrix.target }}-

      # Build both the proxy binary (`aphrodite`) AND the plugin dylib
      # (`libaphrodite_hermes`) - the Hermes plugin loads the dylib at runtime,
      # so it must ship per-platform alongside the binary.
      - name: Build
        run: cargo build --release -p aphrodite -p aphrodite-hermes --target ${{ matrix.target }}

      - name: Stage release artifacts (full triple)
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          DIR="target/${TARGET}/release"
          if [[ "$TARGET" == *windows* ]]; then
              cp "$DIR/aphrodite.exe"             "aphrodite-${TARGET}.exe"
              cp "$DIR/aphrodite_hermes.dll"      "libaphrodite_hermes-${TARGET}.dll"
          elif [[ "$TARGET" == *apple* ]]; then
              cp "$DIR/aphrodite"                 "aphrodite-${TARGET}"
              cp "$DIR/libaphrodite_hermes.dylib" "libaphrodite_hermes-${TARGET}.dylib"
          else
              cp "$DIR/aphrodite"                 "aphrodite-${TARGET}"
              cp "$DIR/libaphrodite_hermes.so"    "libaphrodite_hermes-${TARGET}.so"
          fi
          ls -lh aphrodite-${TARGET}* libaphrodite_hermes-${TARGET}*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: aphrodite-${{ matrix.target }}
          path: |
            aphrodite-${{ matrix.target }}*
            libaphrodite_hermes-${{ matrix.target }}*
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
        uses: softprops/action-gh-release@v3
        with:
          # Trailing * catches the Windows `.exe`; fail loudly if a rename slips.
          files: |
            aphrodite-${{ matrix.target }}*
            libaphrodite_hermes-${{ matrix.target }}*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/Aphrodite/v')
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Create GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
