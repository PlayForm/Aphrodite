<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="sole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Winged sandal — flat comic/sticker style -->
  <g transform="translate(120,125)">

    <!-- === LEFT WING === -->
    <!-- Main feather sweep -->
    <path d="M-18 -10 Q-60 -55 -80 -30 Q-52 -28 -40 -18 Q-72 -42 -75 -20 Q-50 -12 -36 -8"
          fill="none" stroke="url(#sole)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top feather -->
    <path d="M-18 -14 Q-55 -65 -70 -45 Q-46 -42 -34 -22"
          fill="none" stroke="url(#sole)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Bottom feather -->
    <path d="M-18 -5 Q-50 -40 -55 -18 Q-38 -12 -28 -5"
          fill="none" stroke="url(#sole)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- === SANDAL SOLE === -->
    <!-- Sole body — flat elongated shape -->
    <path d="M-45 10 Q-48 5 -42 -5 Q-30 -18 -5 -22 Q10 -23 20 -20 Q35 -15 45 -5 Q50 2 48 10 Q35 18 5 20 Q-25 20 -45 10 Z"
          fill="url(#sole)" stroke="#5b21b6" stroke-width="3" stroke-linejoin="round"/>

    <!-- Sole highlight (flat comic shine) -->
    <path d="M-30 4 Q-15 -8 10 -10 Q25 -10 35 -2"
          fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- === STRAPS === -->
    <!-- Ankle strap -->
    <path d="M-38 2 Q-25 -30 0 -28 Q20 -28 38 2"
          fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <!-- Toe strap -->
    <path d="M35 -2 Q48 -15 55 -8 Q52 0 42 5"
          fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>

    <!-- === RIGHT WING === -->
    <!-- Main feather sweep -->
    <path d="M18 -10 Q60 -55 80 -30 Q52 -28 40 -18 Q72 -42 75 -20 Q50 -12 36 -8"
          fill="none" stroke="url(#sole)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top feather -->
    <path d="M18 -14 Q55 -65 70 -45 Q46 -42 34 -22"
          fill="none" stroke="url(#sole)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Bottom feather -->
    <path d="M18 -5 Q50 -40 55 -18 Q38 -12 28 -5"
          fill="none" stroke="url(#sole)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- === SPEED LINES (comic effect) === -->
    <line x1="-55" y1="0" x2="-65" y2="2" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-58" y1="6" x2="-68" y2="10" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="55" y1="0" x2="65" y2="2" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="58" y1="6" x2="68" y2="10" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- === TEXT === -->
  <text x="120" y="26" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="11" font-weight="700"
        fill="#a855f7" letter-spacing="3">HERMESCOMPRESS</text>
</svg>
