# aphrodite.toml — Multi-proxy configuration

[defaults]
api_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
ccr_ttl_seconds = 3600

[[proxies]]
name = "cache"
listen = "127.0.0.1:9797"
mode = "cache"
dev = true

[[proxies]]
name = "token"
listen = "127.0.0.1:9798"
mode = "token"
tool_relay = true
dev = true
