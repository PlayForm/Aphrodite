model:
  default: deepseek-v4-pro
  provider: deepseek
  base_url: https://api.deepseek.com/v1
providers:
  deepseek:
    api_key_env: APHRODITE_API_KEY
    max_tokens: 65536
    provider: deepseek
  aphrodite-cache:
    api_key_env: APHRODITE_API_KEY
    base_url: http://127.0.0.1:9797
    max_tokens: 65536
    provider: deepseek
  aphrodite-token:
    api_key_env: APHRODITE_API_KEY
    base_url: http://127.0.0.1:9798
    max_tokens: 65536
    provider: deepseek
fallback_providers:
- deepseek
context:
  engine: compressor
compression:
  enabled: false
  threshold: 0.5
toolsets: '["hermes-cli"]'
agent:
  default_skills:
  - plan-then-delegate
  - execution-blocks
  - aphrodite-dev-workflow
