model:
  default: deepseek-v4-pro
  provider: aphrodite-cache
providers:
  deepseek:
    api_key_env: APHRODITE_API_KEY
    max_tokens: 65536
    provider: deepseek
  aphrodite-cache:
    api_key_env: APHRODITE_API_KEY
    base_url: http://127.0.0.1:9797
    max_tokens: 65536
    provider: deepseek
  aphrodite-token:
    api_key_env: APHRODITE_API_KEY
    base_url: http://127.0.0.1:9798
    max_tokens: 65536
    provider: deepseek
fallback_providers:
- deepseek
context:
  engine: aphrodite
compression:
  enabled: false
  threshold: 0.0
toolsets: '["hermes-cli", "aphrodite"]'
agent:
  show_tool_calls: true
  default_skills:
  - plan-then-delegate
  - execution-blocks
  - aphrodite-dev-workflow
display:
  compact: false
  streaming: true
  show_reasoning: true
logging:
  level: DEBUG
