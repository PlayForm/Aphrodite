[project]
name = "hermes-compress"
version = "0.7.5"
description = "Headroom-powered context compression — slash LLM token usage by 25-60%"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "headroom-ai[all]>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_compress"]
