language = "C"
include_guard = "APHRODITE_HERMES_H"
autogen_warning = "/* Warning: generated by cbindgen via crates/aphrodite-hermes/build.rs - do not edit. */"

# Only the crate's own C ABI surface crosses the boundary. Everything else in
# the module tree (the `aphrodite::state::AphroditeState` re-export, crate
# internals) is deliberately excluded: the header feeds ctypesgen, and every
# symbol in it becomes a ctypes declaration in plugins/aphrodite/_bindings.py.
[export]
include = ["aphrodite_hermes_*"]

[parse]
# The FFI surface is self-contained in this crate's src/lib.rs; pulling in the
# aphrodite crate's public items would pollute the header with types ctypesgen
# does not need (and cbindgen cannot resolve out-of-workspace paths here).
parse_deps = false
