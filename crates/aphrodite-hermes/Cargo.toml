[package]
name = "aphrodite-hermes"
version = "1.6.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite-hermes: Hermes Agent-specific integration for Aphrodite compression engine - tool schemas, hook dispatch, skill registration"

[[bin]]
name = "aphrodite-hermes-setup"
path = "src/bin/setup-helper.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
aphrodite = { path = "../aphrodite", version = "1.6.2", default-features = false }
serde_json = { workspace = true }
dirs = "7.0.0"
notify = "8.2.0"

# Build-time FFI codegen (cbindgen -> aphrodite_hermes.h -> ctypesgen ->
# plugins/aphrodite/_bindings.py). These crates are consumed by build.rs and
# discarded after the build - zero impact on the dylib itself. The generated
# _bindings.py is the committed artifact; build.rs degrades to the committed
# copy whenever the codegen tools are unavailable (see CODEGEN.md).
[build-dependencies]
cbindgen = "0.29.4"
