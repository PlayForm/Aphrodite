[package]
name = "aphrodite-hermes"
version = "1.3.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite-hermes: Hermes Agent-specific integration for Aphrodite compression engine - tool schemas, hook dispatch, skill registration"

[[bin]]
name = "aphrodite-hermes-setup"
path = "src/bin/setup-helper.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
aphrodite = { path = "../aphrodite", version = "1.3.8", default-features = false }
serde_json = { workspace = true }

[features]
# Mirrors the core crate's optional S2 navigation feature, and forwards to it -
# `tools.rs` and `schemas.rs` both gate `aphrodite_navigate` on this. Must be
# declared even while unused by default, or `unexpected_cfg_condition` fails
# CI's `-D warnings`.
navigation = ["aphrodite/navigation"]
