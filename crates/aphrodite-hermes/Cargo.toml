[package]
name = "aphrodite-hermes"
version = "1.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite-hermes: Hermes Agent-specific integration for Aphrodite compression engine - tool schemas, hook dispatch, skill registration"

[[bin]]
name = "aphrodite-hermes-setup"
path = "src/bin/setup-helper.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
aphrodite = { path = "../aphrodite", version = "1.3.5", default-features = false }
serde_json = { workspace = true }
