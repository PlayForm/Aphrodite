# ── Aphrodite Configuration ────────────────────────────────────────────────
# TOML-driven feature toggles, thresholds, preview templates, and prompt styles.
# APHRODITE_* env vars override api_url/model/ccr_ttl_seconds/ccr_db_path/
# notify_url/notify_key and the four compression thresholds at runtime (see
# docs/config/env-vars.md for the full list - not every key is overridable).
# Generated by `aphrodite setup` - {api_url} / {model}
# Ports below default to 9797/9798 but can be overridden per-instance via
# `aphrodite setup --cache-port <port> --token-port <port>` or the
# APHRODITE_CACHE_PORT / APHRODITE_TOKEN_PORT env vars - this lets multiple
# Hermes Agents run concurrently on the same machine without conflicting.

[[proxies]]
name = "cache"
listen = "127.0.0.1:{cache_port}"
mode = "cache"
tool_relay = true
timeout = 120

[[proxies]]
name = "token"
listen = "127.0.0.1:{token_port}"
mode = "token"
tool_relay = true
timeout = 300

# ── Shared defaults (applied to all proxies unless overridden) ──────────────
[defaults]
api_url = "{api_url}"
model = "{model}"
ccr_ttl_seconds = 3600


# ══════════════════════════════════════════════════════════════════════════════
#  COMPRESSION  -  thresholds, engine, auto-expand, classifier poll
# ══════════════════════════════════════════════════════════════════════════════
[compression]
engine_threshold_pct = 45   # compress at 45% context
engine_protect_first = 2    # messages to keep at start
engine_protect_last = 5     # messages to keep at end
engine_min_msgs = 8         # minimum messages before activating
tool_threshold_token = 512  # token proxy threshold (bytes)
tool_threshold_cache = 4096 # cache proxy threshold (bytes)
terminal_threshold = 256    # terminal output threshold (bytes)
inline_threshold = 2048     # inline zlib fallback threshold (bytes)
auto_expand = false         # off: markers stay raw
auto_expand_limit = 0       # 0 = disabled
catalog_mode = "tool"       # compact | full | tool
classifier_poll = true      # skip CCR for clean outputs
code_multiplier = 3.0       # multiply threshold for code types
context_engine = true       # dylib-path only (aphrodite_stats/config_get/set,
# aphrodite_dispatch) - a status flag exposed by
# the C-ABI/Hermes bridge; the standalone HTTP
# proxy (main.rs/proxy.rs) never reads it and has
# no gated behavior tied to this key
prefetch = true # enable aphrodite_prefetch tool


# ══════════════════════════════════════════════════════════════════════════════
#  PREVIEWS  -  model-aware templates, code structure maps
# ══════════════════════════════════════════════════════════════════════════════
[previews]
model_family = "code_first" # compact | code_first | balance
code_structure_map = true   # show fn/struct/class sigs
preview_max_chars = 120     # max chars per preview line


# ══════════════════════════════════════════════════════════════════════════════
#  PROMPTS  -  how the system instructs the LLM about CCR
# ══════════════════════════════════════════════════════════════════════════════
[prompts]
retrieve_guidance = "verbose" # minimal | standard | verbose
ccr_marker_hint = true        # append "…(use aphrodite_retrieve)"?
catalog_intent_hints = true   # show intent=read with hashes?
# First-turn orientation: injected once on turn 0 by pre_llm_call.
# Ships a default when this key is absent; set to "" to disable.
session_inject = "CCR markers (<<<CCR:hash|type|size>>>) are compressed content the engine stored. aphrodite_retrieve(hash) returns the original. After EVERY tool call: scan for <<<CCR: and retrieve ALL markers before acting. NEVER re-read a file you already have a marker for. Use aphrodite_catalog to see stored entries, aphrodite_prefetch for background loads, and aphrodite_directive(\"list\") for active behavioral directives."

# ══════════════════════════════════════════════════════════════════════════════
#  DIRECTIVES  -  conversational behavioral context (swappable .md files)
# ══════════════════════════════════════════════════════════════════════════════
[directives]
# Active directives loaded from directives/*.md at startup.
# Swap mid-conversation via aphrodite_directive("swap", "explore").
active = [] # e.g. ["focus", "foresight"]


# ══════════════════════════════════════════════════════════════════════════════
#  FLOW  -  per-turn injected-context assembler (report 05)
# ══════════════════════════════════════════════════════════════════════════════
[flow]
# Hard cap for ALL per-turn injected context; kept below Hermes's 10k-char
# spill threshold. Env: APHRODITE_FLOW_BUDGET_CHARS.
budget_chars = 4000
