[package]
name = "aphrodite"
version = "1.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite: Chat Completions proxy with CCR, tool relay, and programmatic CCR for Hermes agent integration."

[[bin]]
name = "aphrodite"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
headroom-core = { path = "../../vendor/headroom/crates/headroom-core", version = "0.1.0" }
axum = { version = "0.8.9", features = ["macros"], optional = true }
tokio = { version = "1.52.3", features = [
	"macros",
	"rt-multi-thread",
	"signal",
	"net",
	"io-util",
	"time",
	"tracing",
], optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.0", features = ["trace", "request-id", "cors"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
	"json",
	"rustls",
	"stream",
], optional = true }
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = [
	"json",
	"env-filter",
	"fmt",
], optional = true }
tracing-appender = { version = "0.2.5", optional = true }
anyhow = { version = "1.0.102", optional = true }
thiserror = { workspace = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.32", optional = true }
futures-util = { version = "0.3.32", optional = true }
rand = { version = "0.10.1", optional = true }
tokio-util = { version = "0.7.18", features = ["rt"], optional = true }
url = { version = "2.5.8", optional = true }
http = { version = "1.4.2", optional = true }
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.10.1", optional = true }
uuid = { version = "1.23.3", features = ["v4"], optional = true }
lru = { version = "0.18.0", optional = true }
dirs = { version = "6.0.0" }

chrono = { version = "0.4.45", features = ["serde"] }

toml = "1.1"
zstd = { version = "0.13.3", default-features = false }
rhai = { version = "1.25.1", optional = true }
notify = { version = "8.2.0", optional = true }
regex = "1.12.4"
blake3 = "1.7"

[features]
default = ["proxy"]
proxy = [
	"axum", "tokio", "tower", "tower-http", "reqwest", "clap",
	"tracing-subscriber", "tracing-appender", "anyhow",
	"bytes", "futures", "futures-util", "rand", "tokio-util",
	"url", "http", "http-body-util", "hyper", "uuid", "lru",
	"notify",
]
scripting = ["rhai"]

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml = "1.1"
