[package]
name = "aphrodite"
version = "1.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite: Chat Completions proxy with CCR, tool relay, and programmatic CCR for Hermes agent integration."
exclude = ["examples/", "tests/", "benches/", "*.md", ".hermes/", ".plans/"]

[[bin]]
name = "aphrodite"
path = "src/main.rs"
required-features = ["proxy"]

[[example]]
name = "bench_01_corpus"
path = "examples/bench_01_corpus.rs"
required-features = ["proxy"]

[[example]]
name = "bench_02_threshold"
path = "examples/bench_02_threshold.rs"
required-features = ["proxy"]

[[example]]
name = "bench_03_retrieve"
path = "examples/bench_03_retrieve.rs"
required-features = ["proxy"]

[[example]]
name = "bench_04_ema"
path = "examples/bench_04_ema.rs"
required-features = ["proxy"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
headroom-core = { package = "aphrodite-headroom-core", path = "../../vendor/headroom/crates/headroom-core", version = "0.1.1" }
axum = { version = "0.8.9", features = ["macros"], optional = true }
tokio = { version = "1.52.3", features = [
	"macros",
	"rt-multi-thread",
	"signal",
	"net",
	"io-util",
	"time",
	"tracing",
], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
	"json",
	"rustls",
	"stream",
], optional = true }
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = [
	"json",
	"env-filter",
	"fmt",
], optional = true }
anyhow = { version = "1.0.102", optional = true }
thiserror = { workspace = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.32", optional = true }
rand = { version = "0.10.1", optional = true }
tokio-util = { version = "0.7.18", features = ["rt"], optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.23.3", features = ["v4"], optional = true }
lru = { version = "0.18.0", optional = true }
dirs = { version = "6.0.0" }

chrono = { version = "0.4.45", features = ["serde"] }

toml = "1.1"
notify = { version = "8.2.0", optional = true }
regex = "1.12.4"
blake3 = "1.7"
s2 = "0.1.0"
s2-navigate = { path = "../s2-navigate" }

[features]
default = ["proxy"]
proxy = [
	"axum",
	"tokio",
	"reqwest",
	"clap",
	"tracing-subscriber",
	"anyhow",
	"bytes",
	"futures",
	"rand",
	"tokio-util",
	"url",
	"uuid",
	"lru",
	"notify",
]

[dev-dependencies]
proptest = "1"
