[package]
name = "aphrodite"
version = "0.5.48"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite: Chat Completions proxy with CCR, tool relay, and programmatic CCR for Hermes agent integration."

[[bin]]
name = "aphrodite"
path = "src/main.rs"

[dependencies]
headroom-core = { path = "../../vendor/headroom/crates/headroom-core" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = { workspace = true }
bytes = { workspace = true }
futures = "0.3"
futures-util = "0.3"
url = "2"
http = "1"
http-body-util = "0.1"
hyper = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

chrono = { version = "0.4", features = ["serde"] }

toml = "0.8"
