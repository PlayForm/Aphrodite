[package]
name = "aphrodite"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "aphrodite: Chat Completions proxy with CCR, tool relay, and programmatic CCR for Hermes agent integration."
exclude = ["examples/", "tests/", "benches/", ".hermes/", ".plans/"]
# NOTE: do NOT add `*.md` here. `src/builtin_directives/*.md` are embedded into
# the binary via `include_str!` (see src/directives/) and MUST ship in the
# crates.io tarball. Cargo does NOT auto-include `include_str!` targets, so a
# recursive `*.md` exclude previously stripped them from v1.3.8, producing a
# tarball that failed to compile on `cargo install`. Removing `*.md` from
# `exclude` is sufficient - `src/` (including the directive .md files) ships by
# default. (An `include = [...]` list was tried but cargo then ignores `exclude`
# entirely and drops src/lib.rs/src/main.rs, breaking the package - so `include`
# is intentionally NOT used here.)

[[bin]]
name = "aphrodite"
path = "src/main.rs"
required-features = ["proxy"]

[[example]]
name = "bench_01_corpus"
path = "examples/bench_01_corpus.rs"
required-features = ["proxy"]

[[example]]
name = "bench_02_threshold"
path = "examples/bench_02_threshold.rs"
required-features = ["proxy"]

[[example]]
name = "bench_03_retrieve"
path = "examples/bench_03_retrieve.rs"
required-features = ["proxy"]

[[example]]
name = "bench_04_ema"
path = "examples/bench_04_ema.rs"
required-features = ["proxy"]

[[example]]
name = "bench_05_type_coverage"
path = "examples/bench_05_type_coverage.rs"
required-features = ["proxy"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
headroom-core = { package = "aphrodite-headroom-core", path = "../../vendor/headroom/crates/headroom-core", version = "0.1.2", default-features = false }
axum = { version = "0.8.9", features = ["macros"], optional = true }
tokio = { version = "1.53.1", features = [
	"macros",
	"rt-multi-thread",
	"signal",
	"net",
	"io-util",
	"time",
	"tracing",
], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = [
	"json",
	"rustls",
	"stream",
], optional = true }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = [
	"json",
	"env-filter",
	"fmt",
], optional = true }
anyhow = { version = "1.0.104", optional = true }
thiserror = { workspace = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.34", optional = true }
rand = { version = "0.10.2", optional = true }
tokio-util = { version = "0.7.19", features = ["rt"], optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.26.1", features = ["v4"], optional = true }
lru = { version = "0.18.4", optional = true }
dirs = { version = "7.0.0" }
toml = "1.1.6+spec-1.1.0"
notify = { version = "8.2.0", optional = true }
regex = "1.13.1"
blake3 = "1.8"

[features]
default = ["proxy"]
proxy = [
	"axum",
	"tokio",
	"reqwest",
	"clap",
	"tracing-subscriber",
	"anyhow",
	"bytes",
	"futures",
	"rand",
	"tokio-util",
	"url",
	"uuid",
	"lru",
	"notify",
]

[dev-dependencies]
proptest = "1"
