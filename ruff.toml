line-length = 100
target-version = "py311"

# crates/aphrodite/templates/ is the byte-identical plugin-shim template
# (drift-guard: diff -q plugins/aphrodite/__init__.py
# crates/aphrodite/templates/__init__.py must stay identical, enforced by
# test_hermes_plugin_shim_template_matches_live). It is a copy, not lintable
# source - byte identity wins over lint, so exclude it wholesale.
extend-exclude = ["crates/aphrodite/templates"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# plugins/aphrodite/_bindings.py is MACHINE-GENERATED by the FFI codegen
# pipeline (cbindgen -> ctypesgen ->
# crates/aphrodite-hermes/codegen/finalize_bindings.py, copy-on-change into
# the plugin submodule). It is never hand-edited. Regeneration can surface
# any of the codes observed in CI on past artifacts (N802/N805/N801/E402/
# F405/B009 plus SIM/UP/C408 siblings), so the whole observed family is
# ignored here rather than chased per regeneration.
[lint.per-file-ignores]
"plugins/aphrodite/_bindings.py" = ["N801", "N802", "N805", "N811", "N812", "E402", "F405", "B009", "SIM", "UP", "C408"]