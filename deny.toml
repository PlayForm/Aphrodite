# cargo-deny configuration for Aphrodite.
#
# Usage:
#   cargo install cargo-deny
#   cargo deny check advisories
#   cargo deny check licenses
#   cargo deny check bans
#   cargo deny check sources
#
# CI integration: run `cargo deny check` as part of CI precheck.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
# Aphrodite is CC0-1.0. Allowed licenses for dependencies. This list is a
# strict allowlist: anything not listed here (including GPL/AGPL/LGPL
# copyleft licenses, which are deliberately omitted) is denied by default.
allow = [
	"CC0-1.0",
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"Unlicense",
	"MPL-2.0",
]
confidence-threshold = 0.8
exceptions = [
	# ring uses a unique ISC variant that cargo-deny may flag as "OpenSSL"
	{ crate = "ring", allow = ["OpenSSL"] },
	# webpki / rustls-webpki uses ISC-like license
	{ crate = "rustls-webpki", allow = ["ISC"] },
	# unicode-ident uses Unicode-3.0
	{ crate = "unicode-ident", allow = ["Unicode-3.0"] },
]

[bans]
multiple-versions = "warn"
deny = []
skip = [
	# proc-macro2 / quote / unicode-ident are ubiquitous transitive deps
	# and may appear at different patch versions across the tree. Allow
	# minor version drift.
	{ name = "proc-macro2" },
	{ name = "quote" },
	{ name = "unicode-ident" },
	# serde derive macros (serde_derive, etc.)
	{ name = "serde_derive" },
	# syn is a compile-time dep used by many derive crates
	{ name = "syn" },
	# FastEmbed and Magika both depend on ort-sys; they may pull slightly
	# different patch versions. Allow minor differences.
	{ name = "ort-sys" },
	# zstd-sys and its vendored C source
	{ name = "zstd-sys" },
]
skip-tree = [
	# headroom-core is vendored; its dep tree is under our control, but
	# cargo-deny doesn't track "vendored" as a source distinction. Skip
	# tree checks for it so we don't double-count its internal dev-deps.
	# Published package name is aphrodite-headroom-core (see
	# vendor/headroom/crates/headroom-core/Cargo.toml).
	{ name = "aphrodite-headroom-core", version = "*" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
